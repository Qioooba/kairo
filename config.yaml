app:
    name: 内网运维工具箱（模拟验收版）
    host: 127.0.0.1
    port: 18090
    auto_open_browser: false
    download_dir: ./downloads
    log_dir: ./logs
    data_dir: ./data
    ssh_debug: false
    ssh_traffic_dump: false
    ssh_log_max_mb: 20
    ssh_log_keep: 3
systems:
    - name: 信贷生产（模拟）
      description: Mock sshd @ 127.0.0.1:2225，root=scripts/fake-websphere
      servers:
        - name: mock-node-1
          host: 127.0.0.1
          port: 2225
          username: test
          auth_type: password
          log_dirs:
            - name: AppSrv01 server1
              path: /opt/IBM/WebSphere/AppServer/profiles/AppSrv01/logs/server1
              patterns:
                - SystemOut*.log
                - SystemErr*.log
                - app*.log
                - gbk_*.log
              encoding: utf-8
            - name: AppSrv01 server1 GBK
              path: /opt/IBM/WebSphere/AppServer/profiles/AppSrv01/logs/server1
              patterns:
                - gbk_*.log
              encoding: gbk
search:
    default_latest_files: 3
    max_matches: 200
    default_context_lines: 30
    timeout_seconds: 30
    max_concurrency: 2
