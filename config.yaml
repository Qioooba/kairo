schema_version: 2

app:
  name: Kairo
  host: 127.0.0.1
  port: 18092
  auto_open_browser: true
  download_dir: ./downloads
  log_dir: ./logs
  data_dir: ./data
  auto_start: false
  free_file_roots: []
  ssh_debug: false
  ssh_traffic_dump: false
  ssh_log_max_mb: 20
  ssh_log_keep: 3
  allow_insecure_host_key: false
  external_openers:
  - name: NotePad++
    path: D:\软件\Notepad++\notepad++.exe
    icon: smFile
  - name: VS Code
    path: /usr/local/bin/code
    icon: smFile
  - name: 我的 IDE
    path: /Applications/我的应用/IDE.app/Contents/MacOS/ide
    icon: smFile
  download_retention_days: 7
  download_max_count: 1000
  # 本地目录比对白名单 (BE-001 fail-closed 安全基线)；默认空切片，禁止任意本地路径读取
  # 可配置允许比对的本地目录前缀，如 ["D:/projects", "C:/Users"]；
  # 显式配置 ["*"] 则表示放行本地任意合法路径（单机可信环境）。
  compare_allowed_roots: []
  # 注意: 激活服务 / 排行榜的地址和密钥默认硬编码在源码里。
  # 本地测试时可通过 internal_endpoints 覆盖 (不随发布包提交给用户)。
  # 详见 internal/license 和 internal/sponsor 包的 var 注释。

