app:
  name: 天命契机
  host: 127.0.0.1
  port: 18092
  auto_open_browser: false
  download_dir: ./downloads
  log_dir: ./logs
  data_dir: ./data
  auto_start: false
  free_file_roots:
  - '*'
  ssh_debug: false
  ssh_traffic_dump: false
  ssh_log_max_mb: 20
  ssh_log_keep: 3
  allow_insecure_host_key: true
  external_openers:
  - name: NotePad++
    path: D:\软件\Notepad++\notepad++.exe
    icon: smFile
  - name: VS Code
    path: /usr/local/bin/code
    icon: smFile
  - name: 我的 IDE
    path: /Applications/我的应用/IDE.app/Contents/MacOS/ide
    icon: smFile
  download_retention_days: 7
  download_max_count: 1000
  compare_allowed_roots:
  - '*'
systems:
- name: 信贷应用服务器
  description: ""
  servers:
  - name: 信贷测试198
    host: 66.0.34.198
    port: 22
    username: credit
    password: credit
    auth_type: password
    log_dirs:
    - name: AppSrv01 server1
      path: /opt/IBM/WebSphere/AppServer/profiles/AppSrv01/logs/server1
      patterns:
      - SystemOut*.log
      - SystemErr*.log
      encoding: gbk
  - name: 信贷测试199
    host: 66.0.34.199
    port: 22
    username: credit
    password: credit
    auth_type: password
    log_dirs:
    - name: AppSrv01 server1
      path: /opt/IBM/WebSphere/AppServer/profiles/AppSrv01/logs/server1
      patterns:
      - SystemOut*.log
