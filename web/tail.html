<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-192.png" />
  <title>实时 tail · Kairo · 天命契机</title>
  <script>
    // 提前读 localStorage 设置主题，避免 FOUC（页面闪烁）
    (function() {
      try {
        var t = localStorage.getItem('kairo_theme');
        if (!t) {
          var oldT = localStorage.getItem('dtb_theme') || localStorage.getItem('otb_theme');
          if (oldT) localStorage.setItem('kairo_theme', oldT);
          t = oldT;
        }
        if (t === 'dark' || t === 'light' || t === 'green' || t === 'hc' || t === 'xianxia') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/vendor/search-hl.css?v=20260707" />
  <style>
    /* tail 独立窗口专用：尽量窄、尽量高，避免在浏览器里被挤 */
    body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { display: flex; flex-direction: column; height: 100vh; }
    .topbar { padding: 8px 14px; }
    .tail-standalone {
      flex: 1; display: flex; flex-direction: column;
      padding: 10px 14px; gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .tail-standalone .tail-meta { flex: 0 0 auto; }
    .tail-standalone .tail-login { flex: 0 0 auto; }
    .tail-standalone .btn-row { flex: 0 0 auto; }
    .tail-standalone #tail-highlight { flex: 0 0 auto; }
    .tail-standalone .tail-out {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      font-size: 12.5px;
      overflow-y: scroll;
      overflow-x: scroll;
      white-space: pre;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
    }
    .tail-meta {
      display: flex; gap: 12px; flex-wrap: wrap;
      padding: 8px 12px; background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 8px;
      font-size: 12.5px; color: var(--text-dim);
    }
    .tail-meta .meta-key { color: var(--text-mute); margin-right: 4px; }
    .tail-meta .meta-val { color: var(--text); font-family: ui-monospace, monospace; }
    .tail-meta .badge { padding: 1px 8px; border-radius: 4px; background: rgba(79,140,255,0.15); color: var(--primary-2); font-weight: 600; }
    .tail-login {
      display: none;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .tail-login label { min-width: 180px; margin-bottom: 0; }
    .search-bar {
      display: flex; gap: 6px; align-items: center;
      padding: 6px 10px; background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 8px;
      flex: 0 0 auto;
    }
    .search-bar input[type="text"] {
      flex: 1; min-width: 120px; font-family: ui-monospace, monospace; font-size: 12.5px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--bg-1); color: var(--text);
    }
    .search-bar input[type="text"]:focus { outline: none; border-color: var(--primary-2); box-shadow: 0 0 0 2px rgba(79,140,255,0.2); }
    .search-bar .search-count { font-size: 11.5px; color: var(--text-dim); min-width: 60px; text-align: center; }
    .search-bar .btn { padding: 4px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="main">
    <header class="topbar">
      <div class="crumbs">实时 tail（独立窗口）</div>
      <div class="topbar-right">
        <span id="conn-dot" class="dot dot-idle"></span>
        <span id="conn-text" class="muted">连接中…</span>
      </div>
    </header>
    <section class="tail-standalone">
      <div class="tail-meta" id="meta">
        <span><span class="meta-key">系统:</span><span class="meta-val" id="m-system">-</span></span>
        <span><span class="meta-key">服务器:</span><span class="meta-val" id="m-server">-</span></span>
        <span><span class="meta-key">目录:</span><span class="meta-val" id="m-dir">-</span></span>
        <span><span class="meta-key">文件:</span><span class="meta-val" id="m-file">-</span></span>
        <span><span class="badge" id="m-lines">0 行</span></span>
      </div>
      <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="搜索日志内容…（Ctrl+F / ⌘F）" autocomplete="off" />
        <button class="btn" id="search-prev" title="上一个匹配 (Shift+Enter)">↑</button>
        <button class="btn" id="search-next" title="下一个匹配 (Enter)">↓</button>
        <span class="search-count" id="search-count"></span>
        <button class="btn" id="search-clear" title="清除搜索 (Esc)">✕</button>
      </div>
      <form class="tail-login" id="tail-login">
        <label>
          <span class="text-dim">SSH 用户名</span>
          <input type="text" id="tail-user" autocomplete="username" />
        </label>
        <label>
          <span class="text-dim">SSH 密码</span>
          <input type="password" id="tail-pass" autocomplete="current-password" />
        </label>
        <button class="btn btn-primary" type="submit">开始跟踪</button>
      </form>
      <div class="btn-row">
        <button id="btn-pause" class="btn">暂停</button>
        <button id="btn-clear" class="btn">清屏</button>
        <button id="btn-stop" class="btn btn-danger">停止 tail</button>
        <button id="btn-close" class="btn">关闭本页</button>
        <!-- v0.6：行号显示开关。默认开，localStorage 记忆，trim 后行号仍连续（CSS counter offset） -->
        <label class="inline">
          <input type="checkbox" id="show-line-numbers" />
          <span>行号</span>
        </label>
        <!-- 项 11 修复：可配的"最多保留 N 行"上限（默认 1000）—— 大日志场景下避免页面卡 -->
        <label class="inline" style="margin-left:auto;">
          <span class="text-dim">最多保留</span>
          <input type="number" id="max-lines" min="100" max="50000" step="100" value="1000" style="width: 90px;" />
          <span class="text-dim">行</span>
        </label>
        <span class="text-dim" id="rate">实时显示中</span>
      </div>
      <div id="tail-highlight"></div>
      <div id="tail-out" class="tail-out">等待数据…</div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/static/core.js"></script>
  <script src="/static/api.js"></script>
  <script src="/static/vendor/search-hl.js?v=20260707"></script>
  <script src="/static/tail.js"></script>
</body>
</html>
