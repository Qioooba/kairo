<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kairo · 宠物悬浮窗</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
  <link rel="stylesheet" href="/static/style.css?v=20260713b" />
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; }
    html {
      margin: 0;
      padding: 0;
      background: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: block;
      background: linear-gradient(165deg, rgba(2, 9, 24, 0.8), rgba(15, 23, 42, 0.55));
      color: var(--text);
      user-select: none;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(96, 165, 250, 0.14), transparent 45%);
      pointer-events: none;
      opacity: .7;
      z-index: 0;
    }
    #float-guide {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 2147483647;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.62);
      border: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(6px);
      font-size: 12px;
      line-height: 1.4;
      color: var(--text);
      text-shadow: 0 1px 8px rgba(0, 0, 0, .35);
      max-width: 220px;
    }
    #float-guide strong { color: #93c5fd; }
    #toast {
      top: 12px;
      right: 12px;
      left: 12px;
      transform: none;
      pointer-events: none;
    }
    .kairo-pet-widget {
      z-index: 2147483647 !important;
      user-select: none;
    }
    .kairo-pet-panel {
      z-index: 2147483647 !important;
    }
    .kairo-pet-bubble {
      z-index: 2147483647 !important;
    }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kairo_theme');
        if (!t) {
          var oldT = localStorage.getItem('dtb_theme') || localStorage.getItem('otb_theme');
          if (oldT) localStorage.setItem('kairo_theme', oldT);
          t = oldT;
        }
        if (t !== 'dark' && t !== 'light' && t !== 'green' && t !== 'hc' && t !== 'xianxia') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <div id="float-guide">拖拽宠物可移动 · 点击可打开属性面板</div>
  <div id="toast" class="toast"></div>

  <script src="/static/core.js?v=20260708"></script>
  <script src="/static/theme.js?v=20260708"></script>
  <script src="/static/api.js?v=20260708"></script>
  <script src="/static/pages/pet.js?v=20260816"></script>
  <script>
    (function () {
      function boot() {
        if (window.Kairo && window.Kairo.theme && window.Kairo.theme.init) {
          window.Kairo.theme.init();
        }
        if (window.Kairo && window.Kairo.pet && window.Kairo.pet.init) {
          window.Kairo.pet.init();
        } else if (window.Kairo && window.Kairo.core && window.Kairo.core.toast) {
          window.Kairo.core.toast('宠物脚本未加载完成，请刷新重试');
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
