<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-192.png" />
  <title>文件预览 · Kairo · 天命契机</title>
  <!-- 与 index.html 一致：在 CSS 加载后立刻读 localStorage 设 data-theme，避免独立窗口深色与主窗口主题不一致 / FOUC -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kairo_theme');
        if (!t) {
          var oldT = localStorage.getItem('dtb_theme') || localStorage.getItem('otb_theme');
          if (oldT) localStorage.setItem('kairo_theme', oldT);
          t = oldT;
        }
        if (t !== 'dark' && t !== 'light' && t !== 'green' && t !== 'hc' && t !== 'xianxia') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* preview 独立窗口：尽量窄、尽量高，避免被侧边栏挤 */
    body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { display: flex; flex-direction: column; height: 100vh; }
    .topbar { padding: 8px 14px; }
    .preview-standalone {
      flex: 1; display: flex; flex-direction: column;
      padding: 10px 14px; gap: 10px; min-height: 0;
    }
    .preview-meta {
      display: flex; gap: 12px; flex-wrap: wrap;
      padding: 8px 12px; background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 8px;
      font-size: 12.5px; color: var(--text-dim);
    }
    .preview-meta .meta-key { color: var(--text-mute); margin-right: 4px; }
    .preview-meta .meta-val { color: var(--text); font-family: ui-monospace, monospace; }
    .preview-meta .badge { padding: 1px 8px; border-radius: 4px; font-weight: 600; }
    .preview-meta .badge-ok { background: rgba(16,185,129,0.18); color: #10b981; }
    .preview-meta .badge-warn { background: rgba(245,158,11,0.18); color: #f59e0b; }
    .preview-meta .badge-err { background: rgba(239,68,68,0.18); color: #ef4444; }
    .preview-out {
      flex: 1; min-height: 0; overflow: auto;
      background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px;
      padding: 12px 14px; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12.5px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-all; margin: 0;
    }
    .preview-empty { color: var(--text-dim); padding: 24px; text-align: center; }
    .preview-err {
      padding: 16px; color: #ef4444; background: rgba(239,68,68,0.06);
      border: 1px solid rgba(239,68,68,0.3); border-radius: 8px;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .preview-login {
      display: none;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .preview-login label { min-width: 180px; margin-bottom: 0; }
    .search-bar {
      display: flex; gap: 6px; align-items: center;
      padding: 6px 10px; background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 8px;
      flex: 0 0 auto;
    }
    .search-bar input[type="text"] {
      flex: 1; min-width: 120px; font-family: ui-monospace, monospace; font-size: 12.5px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--bg-1); color: var(--text);
    }
    .search-bar input[type="text"]:focus { outline: none; border-color: var(--primary-2); box-shadow: 0 0 0 2px rgba(79,140,255,0.2); }
    .search-bar .search-count { font-size: 11.5px; color: var(--text-dim); min-width: 60px; text-align: center; }
    .search-bar .btn { padding: 4px 10px; font-size: 12px; }
    mark.search-hl {
      background: #fff176; color: #000; border-radius: 2px; padding: 0 1px;
    }
    mark.search-hl.search-hl-active {
      background: #ff9800; color: #000; box-shadow: 0 0 0 1px #e65100;
    }
    :root[data-theme="dark"] mark.search-hl { background: #f9a825; color: #000; }
    :root[data-theme="dark"] mark.search-hl.search-hl-active { background: #ff6d00; color: #000; }
    :root[data-theme="green"] mark.search-hl { background: #c6ff00; color: #1b5e20; }
    :root[data-theme="green"] mark.search-hl.search-hl-active { background: #76ff03; color: #1b5e20; box-shadow: 0 0 0 1px #33691e; }
    :root[data-theme="hc"] mark.search-hl { background: #ffeb3b; color: #000; }
    :root[data-theme="hc"] mark.search-hl.search-hl-active { background: #ff9800; color: #000; }
    :root[data-theme="xianxia"] mark.search-hl { background: #ffe082; color: #4e342e; }
    :root[data-theme="xianxia"] mark.search-hl.search-hl-active { background: #ffb300; color: #3e2723; }
  </style>
</head>
<body>
  <main class="main">
    <header class="topbar">
      <div class="crumbs">文件预览（独立窗口）</div>
      <div class="topbar-right">
        <span id="conn-dot" class="dot dot-idle"></span>
        <span id="conn-text" class="muted">加载中…</span>
      </div>
    </header>
    <section class="preview-standalone">
      <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="搜索页面内容…（Ctrl+F / ⌘F）" autocomplete="off" />
        <button class="btn" id="search-prev" title="上一个匹配 (Shift+Enter)">↑</button>
        <button class="btn" id="search-next" title="下一个匹配 (Enter)">↓</button>
        <span class="search-count" id="search-count"></span>
        <button class="btn" id="search-clear" title="清除搜索 (Esc)">✕</button>
      </div>
      <div class="preview-meta" id="meta">
        <span><span class="meta-key">系统:</span><span class="meta-val" id="m-system">-</span></span>
        <span><span class="meta-key">服务器:</span><span class="meta-val" id="m-server">-</span></span>
        <span><span class="meta-key">路径:</span><span class="meta-val" id="m-path">-</span></span>
        <span><span class="meta-key">大小:</span><span class="meta-val" id="m-size">-</span></span>
        <span><span class="meta-key">编码:</span><span class="meta-val" id="m-encoding">-</span></span>
        <span id="m-trunc-wrap" style="display:none"><span class="badge badge-warn" id="m-trunc">已截断</span></span>
        <span id="m-binary-wrap" style="display:none"><span class="badge badge-warn" id="m-binary">二进制</span></span>
      </div>
      <form class="preview-login" id="preview-login">
        <label>
          <span class="text-dim">SSH 用户名</span>
          <input type="text" id="preview-user" autocomplete="username" />
        </label>
        <label>
          <span class="text-dim">SSH 密码</span>
          <input type="password" id="preview-pass" autocomplete="current-password" />
        </label>
        <button class="btn btn-primary" type="submit">加载预览</button>
      </form>
      <div class="btn-row">
        <button id="btn-refresh" class="btn">刷新</button>
        <button id="btn-download" class="btn">下载完整文件</button>
        <button id="btn-close" class="btn">关闭本页</button>
        <span class="text-dim" id="read-info" style="margin-left:auto;"></span>
      </div>
      <pre id="preview-out" class="preview-out">加载中…</pre>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script>
    // ===== preview.html 独立窗口 JS =====
    // 从 query string 拿 system/server/path/encoding，
    // 从 opener.Kairo 拿凭据（如果开了"记住密码"已经在 opener 里），
    // 调 /api/files/preview，显示文本 / 二进制提示。

    (function () {
      'use strict';
      if (!window.Kairo) window.Kairo = {};
      const $ = (s) => document.querySelector(s);
      const { api } = window.Kairo.api || {};
      // FE-003：优先走 Kairo.api.api() —— 它会在 401 时触发登录引导（requireLogin）。
      // 但 api() 内部依赖 window.Kairo.core.setStatus；preview 独立窗口没加载 core.js，
      // 此时 api() 调用会抛错。这里做 fallback：core 没就绪时退回裸 fetch 兜底，
      // 并复刻 api() 的「401→requireLogin / !ok→throw」语义，保证功能不中断。
      const coreReady = !!(window.Kairo && window.Kairo.core);
      async function request(method, path, body) {
        const opts = { method, headers: {}, credentials: 'same-origin' };
        if (body !== undefined) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(body);
        }
        const resp = await fetch(path, opts);
        let data = null;
        try { data = await resp.json(); } catch (e) { /* ignore */ }
        if (resp.status === 401 && data && data.auth_required) {
          if (window.Kairo.auth && window.Kairo.auth.requireLogin) window.Kairo.auth.requireLogin();
          const err = new Error((data && data.error) || '需要登录');
          err.authRequired = true;
          throw err;
        }
        if (!resp.ok) {
          throw new Error((data && data.error) || ('HTTP ' + resp.status));
        }
        return data;
      }
      const call = (typeof api === 'function' && coreReady) ? api : request;
      const params = new URLSearchParams(location.search);
      const system = params.get('system') || '';
      const server = params.get('server') || '';
      const path = params.get('path') || '';
      const encoding = params.get('encoding') || 'utf-8';
      // v0.11+：source=ssh-sftp 表示来自 SSH 终端内嵌 SFTP 面板，
      // 走 /api/ssh/sftp/preview（不走 free_file_roots 白名单）。
      // 默认（files 页）走 /api/files/preview（受白名单约束）。
      const source = params.get('source') || '';
      const previewApi = source === 'ssh-sftp' ? '/api/ssh/sftp/preview' : '/api/files/preview';

      $('#m-system').textContent = system || '?';
      $('#m-server').textContent = server || '?';
      $('#m-path').textContent = path || '?';
      $('#m-encoding').textContent = encoding;

      function toast(msg, type) {
        const t = $('#toast');
        t.textContent = msg;
        t.className = 'toast show' + (type ? ' ' + type : '');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { t.className = 'toast'; }, 2400);
      }

      function setConn(state, text) {
        const dot = $('#conn-dot');
        const txt = $('#conn-text');
        dot.className = 'dot dot-' + (state || 'idle');
        txt.textContent = text || (state === 'busy' ? '加载中…' : state === 'ok' ? '已加载' : state === 'err' ? '失败' : '就绪');
      }

      const loginForm = $('#preview-login');
      const userInp = $('#preview-user');
      const passInp = $('#preview-pass');
      let activeCred = null;

      // 拿凭据：opener window 同源直接取（用户在主页已输入）。
      // P0-BUG-3 修复：拿不到 password 时返回 null（不是空 password），
      // 让 doPreview 走"直接调后端"路径——后端有 keyring 兜底。
      function getCred() {
        try {
          const op = window.opener;
          if (op && op.Kairo && op.Kairo._previewCred && op.Kairo._previewCred[system + '::' + server]) {
            const c = op.Kairo._previewCred[system + '::' + server];
            if (c && c.username && c.password) return c;
          }
        } catch (e) { /* ignore cross-origin */ }
        return activeCred || null;
      }
      function showLogin() {
        if (!loginForm) return;
        loginForm.style.display = 'flex';
        setConn('idle', '等待凭据');
        setTimeout(() => userInp && userInp.focus(), 0);
      }
      function hideLogin() {
        if (loginForm) loginForm.style.display = 'none';
      }

      async function doPreview(cred) {
        if (!system || !server || !path) {
          toast('参数缺失：system / server / path', 'err');
          setConn('err', '参数缺失');
          $('#preview-out').textContent = '';
          return;
        }
        cred = cred || getCred();
        // P0-BUG-3：cred 缺失时仍然**直接调后端**——后端会走 keyring 兜底。
        // 老逻辑是"没 password 就 showLogin 等用户输入"，但 opener 拿不到密码是常态，
        // 导致每次预览都弹 login，纯粹多余。
        activeCred = cred || { username: '', password: '' };
        hideLogin();

        setConn('busy', '加载中…');
        try {
          // FE-003：走 call()（Kairo.api.api() 优先，401 触发登录引导），
          // 退化时用裸 fetch 兜底。call() 返回解析后的 data，!ok/401 时抛错。
          // BUG-3：cred 可能是 null（getCred() opener 拿不到 password 时返回 null），
          // 改读 activeCred（有 || {username:'',password:''} 兜底，永远是对象）。
          const data = await call('POST', previewApi, {
            system: system, server: server, path: path,
            username: activeCred.username, password: activeCred.password,
            encoding: encoding, max_bytes: 1048576
          });
          renderPreview(data);
          setConn('ok', '已加载');
        } catch (e) {
          $('#preview-out').innerHTML = '';
          const div = document.createElement('div');
          div.className = 'preview-err';
          div.textContent = '预览失败：' + (e && e.message ? e.message : '未知错误');
          $('#preview-out').appendChild(div);
          setConn('err', '失败');
        }
      }

      function formatBytes(n) {
        n = Number(n) || 0;
        const u = ['B', 'KB', 'MB', 'GB', 'TB'];
        let i = 0;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return n.toFixed(i ? 1 : 0) + ' ' + u[i];
      }

      let onPreviewRendered = function() {};

      function renderPreview(d) {
        $('#m-system').textContent = system;
        $('#m-server').textContent = server;
        $('#m-path').textContent = d.path || path;
        $('#m-size').textContent = formatBytes(d.size || 0);
        $('#m-encoding').textContent = d.encoding || encoding;
        $('#read-info').textContent = '已读 ' + (d.bytes_read || 0) + ' 字节' +
          (d.truncated ? '（文件 ' + formatBytes(d.size) + ' 更大）' : '');
        $('#m-trunc-wrap').style.display = d.truncated ? '' : 'none';
        $('#m-binary-wrap').style.display = d.is_binary ? '' : 'none';
        $('#preview-out').innerHTML = '';
        if (d.is_binary) {
          const div = document.createElement('div');
          div.className = 'preview-empty';
          div.textContent = '二进制文件，前 8KB 含 NUL 字节（占比 > 5%）。请用「下载完整文件」查看。';
          $('#preview-out').appendChild(div);
          onPreviewRendered();
          return;
        }
        // 用 textContent 自动 escape，避免渲染 XSS
        $('#preview-out').textContent = d.content || '（文件为空）';
        onPreviewRendered();
      }

      // 按钮事件
      $('#btn-refresh').addEventListener('click', () => doPreview(activeCred || getCred()));
      $('#btn-close').addEventListener('click', () => { window.close(); });
      $('#btn-download').addEventListener('click', async () => {
        // P0-BUG-3：getCred() 可能返回 {username:'', password:''}（无凭据），
        // 但仍然发请求——后端有 keyring 兜底。
        const cred = activeCred || getCred() || { username: '', password: '' };
        try {
          // FE-003：走 call()（Kairo.api.api() 优先，401 触发登录引导）。
          const d = await call('POST', '/api/files/download', {
            system: system, server: server, path: path,
            username: cred.username || '', password: cred.password || '',
            paths: [path], zip: false
          });
          if (d && d.id) toast('下载任务已启动：' + d.id, 'ok');
          else toast('启动失败：未知', 'err');
        } catch (e) {
          toast('启动失败：' + (e && e.message ? e.message : '未知'), 'err');
        }
      });

      if (loginForm) {
        loginForm.addEventListener('submit', (ev) => {
          ev.preventDefault();
          const cred = {
            username: userInp ? userInp.value : '',
            password: passInp ? passInp.value : ''
          };
          if (!cred.username || !cred.password) {
            toast('请输入 SSH 用户名和密码', 'warn');
            return;
          }
          activeCred = cred;
          doPreview(cred);
        });
      }

      // ===== 页面内搜索 / 高亮 =====
      let searchTerm = '';
      let searchMatches = [];
      let searchActiveIdx = -1;
      const searchInp = $('#search-input');
      const searchCountEl = $('#search-count');
      const searchPrevBtn = $('#search-prev');
      const searchNextBtn = $('#search-next');
      const searchClearBtn = $('#search-clear');
      const previewOut = $('#preview-out');

      function escapeRegExp(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function clearSearchHighlights() {
        const marks = previewOut.querySelectorAll('mark.search-hl');
        for (let i = marks.length - 1; i >= 0; i--) {
          const m = marks[i];
          const p = m.parentNode;
          while (m.firstChild) p.insertBefore(m.firstChild, m);
          p.removeChild(m);
          p.normalize();
        }
        searchMatches = [];
        searchActiveIdx = -1;
        searchCountEl.textContent = '';
      }

      function highlightTextNode(textNode, regex) {
        const text = textNode.nodeValue;
        if (!text) return [];
        const ms = [];
        let mm;
        regex.lastIndex = 0;
        while ((mm = regex.exec(text)) !== null) {
          if (mm[0].length === 0) { regex.lastIndex++; continue; }
          ms.push({ start: mm.index, length: mm[0].length });
        }
        if (!ms.length) return [];
        const frag = document.createDocumentFragment();
        let pos = 0;
        const created = [];
        ms.forEach(function(match) {
          if (match.start > pos) {
            frag.appendChild(document.createTextNode(text.slice(pos, match.start)));
          }
          const mk = document.createElement('mark');
          mk.className = 'search-hl';
          mk.textContent = text.slice(match.start, match.start + match.length);
          frag.appendChild(mk);
          created.push(mk);
          pos = match.start + match.length;
        });
        if (pos < text.length) {
          frag.appendChild(document.createTextNode(text.slice(pos)));
        }
        textNode.parentNode.replaceChild(frag, textNode);
        return created;
      }

      function applySearchHighlight(term) {
        clearSearchHighlights();
        if (!term) return;
        const regex = new RegExp(escapeRegExp(term), 'gi');
        const walker = document.createTreeWalker(previewOut, NodeFilter.SHOW_TEXT, {
          acceptNode: function(node) {
            if (!node.nodeValue) return NodeFilter.FILTER_REJECT;
            let p = node.parentNode;
            while (p && p !== previewOut) {
              if (p.classList && p.classList.contains('search-hl')) return NodeFilter.FILTER_REJECT;
              p = p.parentNode;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        const tnodes = [];
        let n;
        while ((n = walker.nextNode())) tnodes.push(n);
        const marks = [];
        tnodes.forEach(function(tn) {
          const c = highlightTextNode(tn, regex);
          for (let i = 0; i < c.length; i++) marks.push(c[i]);
        });
        searchMatches = marks;
        searchActiveIdx = marks.length > 0 ? 0 : -1;
        updateActiveMark();
        updateSearchCount();
        scrollToActiveMark();
      }

      function updateActiveMark() {
        for (let i = 0; i < searchMatches.length; i++) {
          if (i === searchActiveIdx) {
            searchMatches[i].classList.add('search-hl-active');
          } else {
            searchMatches[i].classList.remove('search-hl-active');
          }
        }
      }

      function updateSearchCount() {
        if (!searchTerm) { searchCountEl.textContent = ''; return; }
        if (searchMatches.length === 0) {
          searchCountEl.textContent = '无匹配';
        } else {
          searchCountEl.textContent = (searchActiveIdx + 1) + ' / ' + searchMatches.length;
        }
      }

      function scrollToActiveMark() {
        if (searchActiveIdx < 0 || !searchMatches[searchActiveIdx]) return;
        searchMatches[searchActiveIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
      }

      function goToNextMatch() {
        if (searchMatches.length === 0) return;
        searchActiveIdx = (searchActiveIdx + 1) % searchMatches.length;
        updateActiveMark();
        updateSearchCount();
        scrollToActiveMark();
      }

      function goToPrevMatch() {
        if (searchMatches.length === 0) return;
        searchActiveIdx = (searchActiveIdx - 1 + searchMatches.length) % searchMatches.length;
        updateActiveMark();
        updateSearchCount();
        scrollToActiveMark();
      }

      let searchDebounce = null;
      searchInp.addEventListener('input', function() {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(function() {
          searchTerm = searchInp.value;
          applySearchHighlight(searchTerm);
        }, 200);
      });
      searchInp.addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          if (ev.shiftKey) goToPrevMatch();
          else goToNextMatch();
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          searchInp.value = '';
          searchTerm = '';
          clearSearchHighlights();
          searchInp.blur();
        }
      });
      searchPrevBtn.addEventListener('click', goToPrevMatch);
      searchNextBtn.addEventListener('click', goToNextMatch);
      searchClearBtn.addEventListener('click', function() {
        searchInp.value = '';
        searchTerm = '';
        clearSearchHighlights();
        searchInp.focus();
      });

      document.addEventListener('keydown', function(ev) {
        if ((ev.ctrlKey || ev.metaKey) && ev.key === 'f') {
          ev.preventDefault();
          searchInp.focus();
          searchInp.select();
        }
      });

      onPreviewRendered = function() {
        if (searchTerm) {
          applySearchHighlight(searchTerm);
        }
      };

      // 启动
      doPreview(getCred());
    })();
  </script>
</body>
</html>
