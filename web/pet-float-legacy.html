<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kairo 宠物（兼容模式）</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      background: linear-gradient(165deg, rgba(3, 7, 18, 0.98), rgba(17, 24, 39, 0.92));
      color: #dbeafe;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #pet-root {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    #pet-card {
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(30, 41, 59, 0.9);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      gap: 10px;
    }
    #pet-art {
      width: 152px;
      height: 152px;
      border-radius: 14px;
      background: #0f172a no-repeat center/152px 152px;
      image-rendering: pixelated;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    #line1 {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    #line2 {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: -4px;
      text-align: center;
    }
    #toast {
      font-size: 12px;
      color: #e2e8f0;
      min-height: 30px;
      text-align: center;
      line-height: 1.4;
      margin-top: 2px;
      max-width: 220px;
    }
    #tips {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.75);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.35);
      max-width: 220px;
      line-height: 1.4;
      white-space: normal;
    }
    .row {
      font-size: 11px;
      color: #cbd5e1;
    }
    .muted { color: #94a3b8; }
    .btn {
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(59, 130, 246, 0.16);
      color: #dbeafe;
      border-radius: 8px;
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      margin-top: 4px;
      outline: none;
    }
    .btn:hover { background: rgba(59,130,246,0.28); }
    input {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0;
      padding: 4px 8px;
      font-size: 11px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="pet-root">
    <div id="pet-card" class="card"></div>
  </div>
  <script src="/static/pages/pet-legacy.js?v=20260816"></script>
  <script>
    (function () {
      var t = 'dark';
      try {
        var saved = localStorage.getItem('kairo_theme');
        if (saved) t = saved;
      } catch (e) { /* localStorage 不可用（IE7 模式/隐私模式）时用默认主题 */ }
      document.documentElement.setAttribute('data-theme', t);
      if (window.Kairo && window.Kairo.pet && window.Kairo.pet.initLegacy) {
        window.Kairo.pet.initLegacy();
      }
    })();
  </script>
</body>
</html>
