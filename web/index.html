<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h8' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>内网运维工具箱</title>
  <!-- TODO(FE-019): vendor 资源建议加 integrity（SRI）属性；内网工具低优先级，需计算文件 hash -->
  <link rel="stylesheet" href="/static/vendor/diff2html.min.css?v=20260627" />
  <link rel="stylesheet" href="/static/style.css?v=20260629-btnfix" />
  <style>
    .auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
    .auth-card{background:var(--bg-card, #1e293b);border:1px solid var(--border,#334155);border-radius:14px;padding:40px 36px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center}
    .auth-icon{font-size:48px;margin-bottom:8px}
    .auth-title{margin:0 0 8px;font-size:22px;color:var(--text,#e2e8f0);font-weight:600}
    .auth-subtitle{margin:0 0 20px;color:var(--text-dim,#94a3b8);font-size:14px;line-height:1.5}
    .auth-error{background:#450a0a;border:1px solid #dc2626;color:#fca5a5;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;text-align:left}
    .auth-input-group{display:flex;gap:8px;margin-bottom:14px}
    .auth-input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid var(--border,#334155);background:var(--bg,#0f172a);color:var(--text,#e2e8f0);font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;transition:border-color .15s}
    .auth-input:focus{border-color:#3b82f6}
    .auth-submit{padding:10px 20px;white-space:nowrap}
    .auth-hint{margin:0;color:var(--text-dim,#94a3b8);font-size:12px}
    .auth-user-area{display:flex;align-items:center;gap:8px;margin-right:10px}
    .auth-user-label{font-size:12px;color:var(--text-dim,#94a3b8);white-space:nowrap}
    .auth-logout-btn{background:transparent;border:1px solid var(--border,#334155);color:var(--text-dim,#94a3b8);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;transition:all .15s}
    .auth-logout-btn:hover{border-color:#ef4444;color:#ef4444}
  </style>
  <!-- v0.5 #19 主题切换：在 CSS 加载后立刻读 localStorage 设 data-theme，避免 FOUC -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('otb_theme');
        if (t !== 'dark' && t !== 'light' && t !== 'green' && t !== 'hc') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">⚙</div>
      <div class="brand-text">
        <div class="title">OpsToolbox</div>
        <div class="subtitle">内网运维工具箱</div>
      </div>
    </div>
    <nav id="nav" class="nav">
      <a href="#/home" class="nav-item active" data-route="home">首页</a>
      <a href="#/websphere" class="nav-item" data-route="websphere">日志助手</a>
      <a href="#/files" class="nav-item" data-route="files">文件下载</a>
      <a href="#/formatter" class="nav-item" data-route="formatter">报文格式化</a>
      <a href="#/http" class="nav-item" data-route="http">HTTP 测试</a>
      <a href="#/commands" class="nav-item" data-route="commands">常用命令</a>
      <a href="#/diagnostics" class="nav-item" data-route="diagnostics">环境自检</a>
      <a href="#/config" class="nav-item" data-route="config">系统配置</a>
      <a href="#/downloads" class="nav-item" data-route="downloads">
        下载历史
        <span id="dl-badge" class="nav-badge" style="display:none"></span>
      </a>
      <div class="nav-sep">小工具</div>
      <a href="#/timestamp" class="nav-item small" data-route="timestamp">时间戳</a>
      <a href="#/cron" class="nav-item small" data-route="cron">Cron 解析</a>
      <a href="#/jsonpath" class="nav-item small" data-route="jsonpath">JSONPath</a>
      <a href="#/compare" class="nav-item small" data-route="compare">代码比对</a>
      <a href="#/about" class="nav-item small" data-route="about">ℹ️ 关于</a>
    </nav>
    <div class="footer">
      <div id="listen-info" class="muted">—</div>
      <div class="muted">v0.8 · 下载管理 + 工具集 + 全功能完善</div>
    </div>
  </aside>

  <main id="main" class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs">首页</div>
      <div class="topbar-right">
        <button id="theme-toggle" class="theme-toggle" type="button" title="切换主题">🌙</button>
        <span id="status-dot" class="dot dot-idle"></span>
        <span id="status-text" class="muted">就绪</span>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>

  <div id="toast" class="toast"></div>

  <!-- 模块加载顺序：core → theme → api → auth → state → pages → app 入口 -->
  <script src="/static/core.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/api.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/state.js"></script>
  <script src="/static/pages/home.js"></script>
  <script src="/static/pages/websphere.js"></script>
  <script src="/static/pages/files.js"></script>
  <script src="/static/pages/formatter.js"></script>
  <script src="/static/pages/commands.js"></script>
  <script src="/static/pages/diagnostics.js"></script>
  <script src="/static/pages/config.js"></script>
  <script src="/static/pages/downloads.js"></script>
  <!-- v0.7 新增页：HTTP 测试 / 时间戳 / Cron / JSONPath（路由注册在各自的 pages/*.js） -->
  <script src="/static/pages/http.js"></script>
  <script src="/static/pages/timestamp.js"></script>
  <script src="/static/pages/cron.js"></script>
  <script src="/static/pages/jsonpath.js"></script>
  <!-- TODO(FE-019): vendor 资源建议加 integrity（SRI）属性 -->
  <script src="/static/vendor/diff2html.min.js?v=20260627"></script>
  <script src="/static/pages/compare.js"></script>
  <script src="/static/pages/about.js"></script>
  <script src="/static/app.js"></script>
  <script>
    // v0.5 #19：DOM ready 后同步按钮 emoji 到当前主题
    document.addEventListener('DOMContentLoaded', function () {
      if (window.OTB && window.OTB.theme && window.OTB.theme.init) {
        window.OTB.theme.init();
      }
    });
  </script>
</body>
</html>
