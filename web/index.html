  <style>
    .auth-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
    /* v0.13 bug-2：激活弹窗原来吃 --bg-card / --text / --text-dim 等会随主题切换的变量，
       在 light/green/xianxia 几个浅色主题下 --text / --text-dim 仍是偏暗色（深绿、墨青、深青）
       直接叠到 #1e293b 深色卡片上对比度只有 2~3:1，subtitle / hint 几乎看不清。
       弹窗是「短暂一次性」界面，本就该是中断性视觉，跟随主题反而扰民。
       改成硬编码深卡 + 浅字，所有主题统一一套颜色，杜绝色彩问题。
       用 .auth-overlay .xxx 加权（specificity 20）压 style.css 里的
       input[type=text]{color:var(--text)} 全局规则（specificity 11），
       确保不被全局 input 规则覆盖。 */
    .auth-overlay .auth-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:40px 36px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center;color:#e2e8f0}
    .auth-overlay .auth-icon{font-size:48px;margin-bottom:8px;color:#cbd5e1}
    .auth-overlay .auth-title{margin:0 0 8px;font-size:22px;color:#f1f5f9;font-weight:600}
    .auth-overlay .auth-subtitle{margin:0 0 20px;color:#94a3b8;font-size:14px;line-height:1.5}
    .auth-overlay .auth-error{background:#450a0a;border:1px solid #dc2626;color:#fca5a5;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;text-align:left}
    .auth-overlay .auth-input-group{display:flex;gap:8px;margin-bottom:14px}
    .auth-overlay .auth-input{flex:1;width:auto;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a !important;color:#e2e8f0 !important;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;transition:border-color .15s;min-height:auto}
    .auth-overlay .auth-input::placeholder{color:#64748b}
    .auth-overlay .auth-input:focus{border-color:#3b82f6}
    .auth-overlay .auth-submit{padding:10px 20px;white-space:nowrap}
    .auth-overlay .auth-hint{margin:0;color:#94a3b8;font-size:12px}
    .auth-overlay .auth-user-area{display:flex;align-items:center;gap:8px;margin-right:10px}
    .auth-overlay .auth-user-label{font-size:12px;color:#94a3b8;white-space:nowrap}
    .auth-overlay .auth-logout-btn{background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;transition:all .15s}
    .auth-overlay .auth-logout-btn:hover{border-color:#ef4444;color:#ef4444}
  </style>
  <!-- v0.5 #19 主题切换：在 CSS 加载后立刻读 localStorage 设 data-theme，避免 FOUC -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kairo_theme');
        if (!t) {
          var oldT = localStorage.getItem('dtb_theme') || localStorage.getItem('otb_theme');
          if (oldT) localStorage.setItem('kairo_theme', oldT);
          t = oldT;
        }
        if (t !== 'dark' && t !== 'light' && t !== 'green' && t !== 'hc' && t !== 'xianxia') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
