<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-192.png" />
  <title>SSH 终端 · Kairo</title>
  <script>
    // 提前读 localStorage 设置主题，避免 FOUC（页面闪烁）
    (function() {
      try {
        var t = localStorage.getItem('kairo_theme');
        if (!t) {
          var oldT = localStorage.getItem('dtb_theme') || localStorage.getItem('otb_theme');
          if (oldT) localStorage.setItem('kairo_theme', oldT);
          t = oldT;
        }
        if (t === 'dark' || t === 'light' || t === 'green' || t === 'hc' || t === 'xianxia') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css?v=20260702" />
  <link rel="stylesheet" href="/static/style.css?v=20260706" />
  <style>
    /* SSH 独立窗口专用：窄边距、全高终端 */
    body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { display: flex; flex-direction: column; height: 100vh; }
    .topbar { padding: 8px 14px; }
    .ssh-standalone {
      flex: 1; display: flex; flex-direction: column;
      padding: 8px 12px; gap: 8px;
      min-height: 0; overflow: hidden;
    }
    .ssh-standalone .ssh-meta {
      flex: 0 0 auto;
      display: flex; gap: 12px; flex-wrap: wrap;
      padding: 6px 12px; background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 8px;
      font-size: 12.5px; color: var(--text-dim);
    }
    .ssh-standalone .ssh-meta .meta-key { color: var(--text-mute); margin-right: 4px; }
    .ssh-standalone .ssh-meta .meta-val { color: var(--text); font-family: ui-monospace, monospace; }
    .ssh-standalone .ssh-toolbar { flex: 0 0 auto; }
    .ssh-standalone .ssh-term-wrap {
      flex: 1 1 auto; min-height: 0; overflow: hidden;
      background: var(--bg, #0f172a); border: 1px solid var(--line);
      border-radius: 6px; padding: 4px;
    }
    .ssh-standalone .ssh-term-wrap .xterm { height: 100%; padding: 4px; }
    .ssh-standalone .ssh-term-wrap .xterm-viewport { background-color: transparent !important; }
    /* 密码弹层复用主页样式 */
    .ssh-pwd-overlay {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.6);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 99998;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .ssh-pwd-card {
      background: var(--bg-card, #1e293b); border: 1px solid var(--border, #334155);
      border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 380px;
      box-shadow: 0 16px 48px rgba(0,0,0,.4);
    }
    .ssh-pwd-title { font-size: 18px; font-weight: 600; color: var(--text, #e2e8f0); margin-bottom: 6px; }
    .ssh-pwd-desc { font-size: 13px; margin-bottom: 16px; color: var(--text-dim, #94a3b8); }
    .ssh-pwd-input {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--border, #334155); background: var(--bg, #0f172a);
      color: var(--text, #e2e8f0); font-size: 14px; font-family: ui-monospace, monospace;
      outline: none; box-sizing: border-box; margin-bottom: 12px;
    }
    .ssh-pwd-input:focus { border-color: var(--primary, #3b82f6); }
    .ssh-pwd-remember { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 16px; color: var(--text-dim, #94a3b8); }
    .ssh-pwd-btnrow { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
  <main class="main">
    <header class="topbar">
      <div class="crumbs">SSH 终端（独立窗口）</div>
      <div class="topbar-right">
        <span id="conn-dot" class="dot dot-idle"></span>
        <span id="conn-text" class="muted">连接中…</span>
      </div>
    </header>
    <section class="ssh-standalone">
      <div class="ssh-meta" id="meta">
        <span><span class="meta-key">系统:</span><span class="meta-val" id="m-system">-</span></span>
        <span><span class="meta-key">服务器:</span><span class="meta-val" id="m-server">-</span></span>
        <span><span class="meta-key">用户:</span><span class="meta-val" id="m-user">-</span></span>
      </div>
      <div class="ssh-toolbar">
        <button id="btn-ctrlc" class="btn btn-sm" title="发送 SIGINT" disabled>Ctrl+C</button>
        <button id="btn-clear" class="btn btn-sm" title="清屏">清屏</button>
        <button id="btn-reconnect" class="btn btn-sm" title="断开重连">重连</button>
        <button id="btn-close" class="btn btn-sm" title="关闭本页">关闭本页</button>
        <button id="btn-bgtoggle" class="btn btn-sm ssh-bg-toggle" title="切换终端背景：跟随主题 / 强制深色">🌓 跟随主题</button>
      </div>
      <div class="ssh-term-wrap">
        <div id="term-container"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/static/core.js?v=20260702"></script>
  <script src="/static/api.js?v=20260702"></script>
  <script src="/static/theme.js?v=20260702"></script>
  <script src="/static/vendor/xterm/xterm.min.js?v=20260702"></script>
  <script src="/static/vendor/xterm/xterm-addon-fit.min.js?v=20260702"></script>
  <script src="/static/vendor/xterm/xterm-addon-web-links.min.js?v=20260702"></script>
  <script>
    (function () {
      'use strict';
      var Kairo = window.Kairo = window.Kairo || {};
      var el = Kairo.core.el;
      var toast = Kairo.core.toast;
      var api = Kairo.api.api;

      // 解析 query 参数
      var params = new URLSearchParams(location.search);
      var system = params.get('system') || '';
      var server = params.get('server') || '';
      var initCols = parseInt(params.get('cols'), 10) || 80;
      var initRows = parseInt(params.get('rows'), 10) || 24;
      var encoding = params.get('encoding') || 'utf-8';

      // 元信息显示
      document.getElementById('m-system').textContent = system || '-';
      document.getElementById('m-server').textContent = server || '-';
      document.getElementById('m-user').textContent = '（连接后显示）';

      function setConn(state, text) {
        var dot = document.getElementById('conn-dot');
        var txt = document.getElementById('conn-text');
        dot.className = 'dot dot-' + (state || 'idle');
        txt.textContent = text || (state === 'busy' ? '连接中…' : '就绪');
      }

      // xterm 主题（与主页同步，4 套）
      var XTERM_THEMES = {
        dark: { background: '#0f172a', foreground: '#e2e8f0', cursor: '#e2e8f0', selectionBackground: '#334155',
                black: '#1e293b', red: '#f87171', green: '#4ade80', yellow: '#facc15', blue: '#60a5fa',
                magenta: '#c084fc', cyan: '#22d3ee', white: '#e2e8f0', brightBlack: '#64748b', brightRed: '#fca5a5',
                brightGreen: '#86efac', brightYellow: '#fde047', brightBlue: '#93c5fd', brightMagenta: '#d8b4fe',
                brightCyan: '#67e8f9', brightWhite: '#f8fafc' },
        light: { background: '#f8fafc', foreground: '#1e293b', cursor: '#1e293b', selectionBackground: '#cbd5e1',
                 black: '#1e293b', red: '#dc2626', green: '#16a34a', yellow: '#ca8a04', blue: '#2563eb',
                 magenta: '#9333ea', cyan: '#0891b2', white: '#f1f5f9', brightBlack: '#64748b', brightRed: '#ef4444',
                 brightGreen: '#22c55e', brightYellow: '#eab308', brightBlue: '#3b82f6', brightMagenta: '#a855f7',
                 brightCyan: '#06b6d4', brightWhite: '#ffffff' },
        green: { background: '#0c1a0c', foreground: '#c8e6c9', cursor: '#a5d6a7', selectionBackground: '#1b3a1b',
                 black: '#0c1a0c', red: '#ef9a9a', green: '#81c784', yellow: '#fff59d', blue: '#90caf9',
                 magenta: '#ce93d8', cyan: '#80deea', white: '#c8e6c9', brightBlack: '#4e6e4e', brightRed: '#ffcdd2',
                 brightGreen: '#a5d6a7', brightYellow: '#fff9c4', brightBlue: '#bbdefb', brightMagenta: '#e1bee7',
                 brightCyan: '#b2ebf2', brightWhite: '#e8f5e9' },
        hc: { background: '#000000', foreground: '#ffffff', cursor: '#ffffff', selectionBackground: '#444444',
              black: '#000000', red: '#ff0000', green: '#00ff00', yellow: '#ffff00', blue: '#0000ff',
              magenta: '#ff00ff', cyan: '#00ffff', white: '#ffffff', brightBlack: '#666666', brightRed: '#ff6666',
              brightGreen: '#66ff66', brightYellow: '#ffff66', brightBlue: '#6666ff', brightMagenta: '#ff66ff',
              brightCyan: '#66ffff', brightWhite: '#ffffff' },
        xianxia: { background: '#f5f8f7', foreground: '#1a2320', cursor: '#4a7a6a', selectionBackground: 'rgba(74,122,106,0.2)',
                   black: '#2a3530', red: '#a82820', green: '#5a8e4c', yellow: '#b8923e', blue: '#4a6a8a',
                   magenta: '#7a5a8a', cyan: '#4a7a6a', white: '#5a6a60', brightBlack: '#7a8a80', brightRed: '#c84840',
                   brightGreen: '#7aac6c', brightYellow: '#d8b25e', brightBlue: '#6a8aaa', brightMagenta: '#9a7aac',
                   brightCyan: '#6a9a8a', brightWhite: '#1a2320' }
      };
      function curTheme() {
        var t = (Kairo.theme && Kairo.theme.get) ? Kairo.theme.get() : 'dark';
        return XTERM_THEMES[t] || XTERM_THEMES.dark;
      }

      if (!system || !server) {
        document.getElementById('term-container').appendChild(el('div', {
          class: 'text-err', text: '缺少 system / server 参数'
        }));
        setConn('err', '参数错误');
      } else {
        startTerminal();
      }

      function startTerminal() {
        var TerminalCtor = window.Terminal;
        if (!TerminalCtor) { toast('xterm.js 未加载', 'err'); return; }

        var term = new TerminalCtor({
          theme: curTheme(), fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
          fontSize: 13, cursorBlink: true, scrollback: 5000, allowProposedApi: true,
          cols: initCols, rows: initRows, rendererType: 'canvas'
        });
        var FitAddonCtor = window.FitAddon && window.FitAddon.FitAddon;
        var WebLinksAddonCtor = window.WebLinksAddon && window.WebLinksAddon.WebLinksAddon;
        var fitAddon = FitAddonCtor ? new FitAddonCtor() : null;
        if (fitAddon) term.loadAddon(fitAddon);
        if (WebLinksAddonCtor) term.loadAddon(new WebLinksAddonCtor());

        var container = document.getElementById('term-container');
        term.open(container);

        var cols = initCols;
        var rows = initRows;
        var ws = null;
        var closed = false;

        setTimeout(function() {
          if (fitAddon) { try { fitAddon.fit(); } catch (e) {} }
          cols = term.cols || initCols;
          rows = term.rows || initRows;
          afterInit();
        }, 50);

        function afterInit() {
        // ===== v0.13+ 终端背景模式切换 =====
        // 模式：'theme' 跟随主题（默认） / 'dark' 强制深色（适合亮色主题对比度不足时）
        var BG_MODE_KEY = 'kairo_ssh_bg_mode';
        var bgMode = (function () {
          try {
            var v = localStorage.getItem(BG_MODE_KEY);
            if (v === 'dark' || v === 'theme') return v;
          } catch (_) {}
          return 'theme';
        })();
        // 强制深色模式覆盖当前主题；其他情况跟随主题
        function effectiveTheme() {
          return bgMode === 'dark' ? XTERM_THEMES.dark : curTheme();
        }
        function applyBgMode() {
          var theme = effectiveTheme();
          var wrap = document.querySelector('.ssh-term-wrap');
          if (wrap && theme && theme.background) wrap.style.background = theme.background;
          // 同步 xterm 内部主题（不仅是外面 wrap 背景）
          try { term.options.theme = theme; } catch (_) {}
        }
        function paintBgToggleBtn() {
          var btn = document.getElementById('btn-bgtoggle');
          if (!btn) return;
          if (bgMode === 'dark') {
            btn.textContent = '🌙 强制深色';
            btn.title = '当前：强制深色。点击切换回跟随主题';
            btn.classList.add('is-dark');
          } else {
            btn.textContent = '🌓 跟随主题';
            btn.title = '当前：跟随主题。点击切换到强制深色（适合亮色主题对比度不够的场景）';
            btn.classList.remove('is-dark');
          }
        }
        document.getElementById('btn-bgtoggle').addEventListener('click', function () {
          bgMode = (bgMode === 'dark') ? 'theme' : 'dark';
          try { localStorage.setItem(BG_MODE_KEY, bgMode); } catch (_) {}
          applyBgMode();
          paintBgToggleBtn();
        });

        // 主题联动：背景模式 = dark 时不跟随，否则跟随主题
        function syncBg() { applyBgMode(); }
        applyBgMode();
        paintBgToggleBtn();
        window.addEventListener('kairo:themechange', function () {
          applyBgMode();
        });

        // ===== v0.13+ 光标行高亮 marker =====
        // xterm.js 没有"输入行 vs 输出行"语义（输入输出同流），
        // 退而求其次在光标所在行左侧画主题色条 + 柔光，视觉锚定"正在编辑的行"。
        // 通过 rAF 读 buffer.cursorY / viewportY 算位置，监听 buffer 滚动。
        var xtermEl = term.element;       // .xterm 容器
        if (xtermEl) {
          var marker = document.createElement('div');
          marker.className = 'ssh-cursor-marker';
          xtermEl.appendChild(marker);
          var rafId = 0;
          function tickCursorMarker() {
            rafId = requestAnimationFrame(tickCursorMarker);
            var buf, cell;
            try {
              buf = term.buffer && term.buffer.active;
              var dim = term._core && term._core._renderService && term._core._renderService.dimensions;
              cell = dim && dim.css && dim.css.cell;
            } catch (_) { return; }
            if (!buf || !cell || !cell.height) {
              marker.classList.remove('visible');
              return;
            }
            var cursorY = (typeof buf.cursorY === 'number') ? buf.cursorY : -1;
            var viewportY = (typeof buf.viewportY === 'number') ? buf.viewportY : 0;
            var screenY = cursorY - viewportY;
            // xterm 内部 padding: 4px；用 css cell 尺寸精确定位
            marker.style.top = (4 + screenY * cell.height) + 'px';
            marker.style.height = cell.height + 'px';
            // 光标不在 viewport 内时不显示
            if (screenY < 0 || screenY >= term.rows) {
              marker.classList.remove('visible');
            } else {
              marker.classList.add('visible');
            }
          }
          rafId = requestAnimationFrame(tickCursorMarker);
          // 卸载时取消 rAF（在 beforeunload 里 dispose term 一并取消）
          var stopMarker = function () { if (rafId) cancelAnimationFrame(rafId); rafId = 0; };
          window.addEventListener('beforeunload', stopMarker);
        }

        // resize
        term.onResize(function (size) {
          cols = size.cols; rows = size.rows;
          sendControl({ type: 'resize', cols: size.cols, rows: size.rows });
        });
        if (fitAddon) {
          var ro = new ResizeObserver(function () { if (!closed && fitAddon) { try { fitAddon.fit(); } catch (e) {} } });
          ro.observe(container);
        }

        // 输入 → WS binary frame（必须 TextEncoder 编码，否则发 text frame）
        var encoder = new TextEncoder();
        term.onData(function (data) {
          if (ws && ws.readyState === 1) ws.send(encoder.encode(data));
        });

        // 按钮
        document.getElementById('btn-ctrlc').addEventListener('click', function () {
          if (!ws || ws.readyState !== 1) { toast('未连接', 'warn'); return; }
          sendControl({ type: 'signal', signal: 'SIGINT' });
        });
        document.getElementById('btn-clear').addEventListener('click', function () { term.clear(); });
        document.getElementById('btn-reconnect').addEventListener('click', function () {
          if (!closed && ws && ws.readyState === 1) {
            sendControl({ type: 'signal', signal: 'SIGKILL' });
            setTimeout(function() {
              if (ws) try { ws.close(); } catch (e) {}
              closed = false;
              term.write('\r\n\x1b[36m重连中…\x1b[0m\r\n');
              connect();
            }, 200);
            return;
          }
          closed = false;
          term.write('\r\n\x1b[36m重连中…\x1b[0m\r\n');
          if (ws) { try { ws.close(); } catch (e) {} }
          connect();
        });
        document.getElementById('btn-close').addEventListener('click', function () { window.close(); });

        function sendControl(obj) {
          if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
        }

        function connect() {
          if (closed) return;
          setConn('busy', '连接中…');
          if (ws) { try { ws.close(); } catch (e) {} ws = null; }
          var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          var url = proto + '//' + location.host + '/api/ssh/shell/ws' +
            '?system=' + encodeURIComponent(system) +
            '&server=' + encodeURIComponent(server) +
            '&cols=' + cols + '&rows=' + rows +
            '&encoding=' + encodeURIComponent(encoding);
          // Bug#13：连接中状态 — 只有重连按钮应该 enabled（其他按钮等连接成功）
          updateStandaloneButtons('connecting');
          try {
            ws = new WebSocket(url);
          } catch (e) {
            term.write('\r\n\x1b[31m连接失败: ' + (e.message || e) + '\x1b[0m\r\n');
            setConn('err', '连接失败');
            closed = true;
            updateStandaloneButtons('closed');
            return;
          }
          ws.binaryType = 'arraybuffer';
          ws.onopen = function () {
            setConn('idle', '已连接');
            // Bug#13：连接成功 → Ctrl+C / 清屏 enabled
            updateStandaloneButtons('connected');
            term.focus();
          };
          ws.onmessage = function (ev) {
            if (closed) return;
            if (typeof ev.data === 'string') {
              handleControl(ev.data);
            } else {
              term.write(new Uint8Array(ev.data));
            }
          };
          ws.onclose = function () {
            if (this !== ws) return;
            if (closed) return;
            term.write('\r\n\x1b[33m— 连接已断开 —\x1b[0m\r\n');
            closed = true;
            setConn('idle', '已断开');
            // Bug#13：断开 → Ctrl+C / 清屏 disabled，但重连 / 关闭本页仍可用
            updateStandaloneButtons('closed');
          };
        }

        // Bug#13：独立窗口 4 个按钮的 disabled 联动。
        // 规则：
        //   - Ctrl+C:  只有 connected 时可用（其他时候发 SIGINT 没意义）
        //   - 清屏:    始终 enabled（清的是 xterm 缓冲，不依赖 ssh 连接）
        //   - 重连:    closed 或 connected 都可用，connecting 时灰着避免重复点
        //   - 关闭本页: 始终 enabled
        function updateStandaloneButtons(state) {
          var btnCtrlC = document.getElementById('btn-ctrlc');
          var btnReconnect = document.getElementById('btn-reconnect');
          if (btnCtrlC) btnCtrlC.disabled = (state !== 'connected');
          if (btnReconnect) btnReconnect.disabled = (state === 'connecting');
        }

        function handleControl(raw) {
          var msg;
          try { msg = JSON.parse(raw); } catch (e) { return; }
          if (!msg || !msg.type) return;
          if (msg.type === 'exit') {
            term.write('\r\n\x1b[33m— shell 已退出（code=' + (msg.code != null ? msg.code : '?') + '）—\x1b[0m\r\n');
            closed = true;
            setConn('idle', '已退出');
            // Bug#13：shell 退出也是 closed 状态
            updateStandaloneButtons('closed');
          } else if (msg.type === 'error') {
            handleError(msg);
          }
        }

        function handleError(msg) {
          var reason = msg.reason || '';
          var message = msg.message || '';
          if (reason === 'no_password') {
            term.write('\r\n\x1b[36m需要 SSH 密码\x1b[0m\r\n');
            promptPassword();
          } else if (reason === 'dial_failed') {
            term.write('\r\n\x1b[31mSSH 连接失败: ' + message + '\x1b[0m\r\n');
            term.write('\r\n\x1b[2m  （检查 host/port/网络/host_key 配置）\x1b[0m\r\n');
            closed = true;
          } else if (reason === 'cred_resolve') {
            term.write('\r\n\x1b[31m凭据解析失败: ' + message + '\x1b[0m\r\n');
            closed = true;
          } else if (reason === 'shell_failed') {
            term.write('\r\n\x1b[31m启动 shell 失败: ' + message + '\x1b[0m\r\n');
            closed = true;
          } else {
            term.write('\r\n\x1b[31m错误: ' + (message || reason) + '\x1b[0m\r\n');
            closed = true;
          }
          setConn('idle', '错误');
          // Bug#13：错误状态也要联动按钮（清屏 / 重连 / 关闭本页 enabled，Ctrl+C disabled）
          updateStandaloneButtons('closed');
        }

        function promptPassword() {
          var overlay = el('div', { class: 'ssh-pwd-overlay' });
          var card = el('div', { class: 'ssh-pwd-card' });
          card.appendChild(el('div', { class: 'ssh-pwd-title', text: '输入 SSH 密码' }));
          card.appendChild(el('div', { class: 'ssh-pwd-desc', text: system + ' / ' + server }));
          var passInput = el('input', { type: 'password', class: 'ssh-pwd-input', autocomplete: 'current-password', placeholder: 'SSH 密码' });
          card.appendChild(passInput);
          var rememberLabel = el('label', { class: 'ssh-pwd-remember inline' }, [
            el('input', { type: 'checkbox', checked: true }), document.createTextNode('记住密码（存到系统 keyring）')
          ]);
          card.appendChild(rememberLabel);
          var btnRow = el('div', { class: 'ssh-pwd-btnrow' });
          var cancelBtn = el('button', { class: 'btn', type: 'button', text: '取消' });
          var okBtn = el('button', { class: 'btn btn-primary', type: 'button', text: '连接' });
          btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
          card.appendChild(btnRow); overlay.appendChild(card);
          document.body.appendChild(overlay);
          setTimeout(function () { passInput.focus(); }, 50);

          function closeOverlay() { overlay.remove(); }
          function submit() {
            var pw = passInput.value;
            if (!pw) { toast('密码不能为空', 'warn'); return; }
            var remember = rememberLabel.querySelector('input').checked;
            if (!remember) {
              toast('Web 终端需要保存密码到 keyring 才能连接，请勾选「记住密码」', 'warn');
              return;
            }
            okBtn.textContent = '保存中…'; okBtn.disabled = true;
            api('GET', '/api/config').then(function (info) {
              var username = '';
              (info.systems || []).forEach(function (s) {
                if (s.name === system) (s.servers || []).forEach(function (sv) {
                  if (sv.name === server) username = sv.username || '';
                });
              });
              document.getElementById('m-user').textContent = username || '-';
              return api('POST', '/api/credentials/save', {
                system: system, server: server, username: username, password: pw
              });
            }).then(function () {
              closeOverlay();
              closed = false;
              connect();
            }).catch(function (e) {
              okBtn.textContent = '连接'; okBtn.disabled = false;
              toast('保存密码失败：' + (e.message || e), 'err');
            });
          }
          okBtn.addEventListener('click', submit);
          cancelBtn.addEventListener('click', function() {
            closeOverlay();
            term.write('\r\n\x1b[2m已取消\x1b[0m\r\n');
            closed = true;
            setConn('idle', '已取消');
          });
          passInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); submit(); }
            if (e.key === 'Escape') {
              e.preventDefault(); closeOverlay();
              term.write('\r\n\x1b[2m已取消\x1b[0m\r\n');
              closed = true;
              setConn('idle', '已取消');
            }
          });
          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
              closeOverlay();
              term.write('\r\n\x1b[2m已取消\x1b[0m\r\n');
              closed = true;
              setConn('idle', '已取消');
            }
          });
        }

        // 拉配置显示 username，然后连接
        api('GET', '/api/config').then(function (info) {
          var username = '';
          (info.systems || []).forEach(function (s) {
            if (s.name === system) (s.servers || []).forEach(function (sv) {
              if (sv.name === server) username = sv.username || '';
            });
          });
          document.getElementById('m-user').textContent = username || '-';
          connect();
        }).catch(function () { connect(); });

        } // end afterInit

        // 页面卸载时关 WS + 释放 xterm 资源
        window.addEventListener('beforeunload', function () {
          if (ws) { try { ws.close(); } catch (e) {} }
          if (term) { try { term.dispose(); } catch (e) {} }
        });
      }
    })();
  </script>
</body>
</html>
