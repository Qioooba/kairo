    assigned_to: verifier
    depends_on: [agent1-backend-core, agent2-frontend-ux]
    role: verify-as-task
    max_retries: 1
    prompt: |-
      你是最终关卡 verifier，整合验证 Agent 1 + Agent 2 的工作。
      工作目录 `/Users/qi/Documents/spaces/ops-toolbox`。

      ## 第一关：基础质量门

      ```bash
      cd /Users/qi/Documents/spaces/ops-toolbox
      gofmt -l .                                # 必须 0 行
      go build -mod=vendor ./...                # 必须成功（vendor 已提交）
      go test -mod=vendor ./... 2>&1 | tail -40 # 必须全部 pass
      node web/app.test.js                      # 必须 7 pass, 0 fail
      ```

      ## 第二关：单元测试覆盖率快速检查

      ```bash
      cd /Users/qi/Documents/spaces/ops-toolbox
      go test -mod=vendor -cover ./... 2>&1 | tail -30
      ```
      至少确认主要包都有测试覆盖（sshclient, sftpclient, logquery, config, dlmanager, audit, downloads, httpserver）。

      ## 第三关：接口烟测（用 mock_sshd + acceptance_run.py）

      ```bash
      cd /Users/qi/Documents/spaces/ops-toolbox

      # 启动 mock sshd
      python3 scripts/mock_sshd.py &
      MOCK_PID=$!
      sleep 2

      # 启动 app（用 OPS_APP_PORT=18090 避开默认 18080）
      OPS_APP_PORT=18090 MOCK_SSHD_PORT=2225 \
        go run -mod=vendor . &
      APP_PID=$!
      sleep 5

      # 跑 acceptance
      python3 scripts/acceptance_run.py 2>&1 | tail -30

      # 收尾
      kill $APP_PID $MOCK_PID 2>/dev/null
      ```

      如果 acceptance 报错，标注 FAIL，但**不要修**，交给 owner 决定。

      ## 第四关：UI 烟测（如果 playwright 可用）

      ```bash
      cd /Users/qi/Documents/spaces/ops-toolbox

      # 起 mock sshd + app
      python3 scripts/mock_sshd.py &
      MOCK_PID=$!
      OPS_APP_PORT=18090 MOCK_SSHD_PORT=2225 \
        go run -mod=vendor . &
      APP_PID=$!
      sleep 5

      # 跑 playwright（如果 docs/qa/node_modules 装了）
      [ -d docs/qa/node_modules ] && {
        cd docs/qa
        OPS_APP_PORT=18090 MOCK_SSHD_PORT=2225 node playwright_smoke.js 2>&1 | tail -40
      } || echo "playwright 未安装，跳过 UI 烟测"

      kill $APP_PID $MOCK_PID 2>/dev/null
      ```

