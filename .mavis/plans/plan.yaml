      7. 不要改 internal/sshclient.go Run() 函数的 line 520 `code := 0`（ChatGPT 误判，是 Stream() 函数的 line 622，作用域独立）

      ## 关键文件路径

      - sshclient: `/Users/qi/Documents/spaces/ops-toolbox/internal/sshclient/sshclient.go` (696 行)
      - sftpclient: `/Users/qi/Documents/spaces/ops-toolbox/internal/sftpclient/sftpclient.go` (259 行)
      - logquery: `/Users/qi/Documents/spaces/ops-toolbox/internal/logquery/logquery.go` (672 行)
