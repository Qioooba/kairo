      - build scripts: `/Users/qi/Documents/spaces/ops-toolbox/scripts/build_windows_amd64.sh` 等
      - docs: `/Users/qi/Documents/spaces/ops-toolbox/docs/ACCEPTANCE.md`, `/Users/qi/Documents/spaces/ops-toolbox/README.md`

