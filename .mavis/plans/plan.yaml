version: 1
plan:
  name: 'OpsToolbox 代码审查 24 项修复'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 8
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  - id: agent1-backend-core
    title: 'Agent 1 - 后端核心修复（SSH/SFTP/logquery/config + vendor）'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |-
      你是 OpsToolbox 后端核心修复 agent，工作目录 `/Users/qi/Documents/spaces/ops-toolbox`。
      完整任务板在 `$MAVIS_SCRATCHPAD`，先 cat 一下看 ChatGPT 报告的核实结论（特别是 P0 编译错误是 ChatGPT 误判，不要修）。

      ## 你的范围（14 项，ChatGPT 报告项号）

      **打包 / 构建基础**：
      - 项 2: vendor 模式（go mod vendor + 构建脚本 -mod=vendor + README/docs/ACCEPTANCE 更新）
      - 项 19: gofmt -w .（必须 0 行，包括根目录 debug_run.go 临时文件）

      **logquery**：
      - 项 3: SearchCommand OR 逻辑重构（保持语义、加回归测试 TestSearchCommand_OR_IncludesFirstBranch / TestSearchCommand_OR_WithNegation）
      - 项 4: ParseQuery 状态机校验（拒绝 `A &&`, `A ||`, `A && && B`，明确支持哪些、明确拒绝哪些）

      **config**：
      - 项 5: Defaults() 不再吞非法 encoding（保留给 Validate 报错）+ 新单测 TestLoadRejectsInvalidEncoding / TestDefaultsNormalizeEncoding
      - 项 21: Config.Clone() DeepCopy + handlers_admin.go 走 Clone()
      - 项 14 部分: 接受 Agent 2 加 free_file_roots 字段，但 Defaults/Validate 你来定（启动警告由 Agent 2 在前端做）

      **sshclient / sftpclient**：
      - 项 8: sftpclient ShellBackend fallback（RemoteFS 接口抽象，cat/dd/base64 三档）
      - 项 9: SSH debug/traffic 日志加配置开关 + 大小限制 + 轮转（默认全关）
      - 项 10: HostKeyCallback 支持 host_key_sha256 pin（默认仍允许 insecure 但 README 标红）
      - 项 22: SSH compat profile 配置化（modern/compat/no-ecdh/legacy/auto，每台 server 可指定）

      **logquery / list**：
      - 项 6: list_mode:auto 真正 fallback（Go 侧 gnu_find 失败自动 posix_ls 后置重试）
      - 项 7: posix_ls 解析修复（文件名空格用 fields[8:] join、mtime 年份补全、grep | head 顺序）

      ## 共享契约（必须跟 Agent 2 对齐）

      config 新增字段（你写在 `internal/config/config.go` 的 `App` 和 `Server` 结构体）：
      ```go
