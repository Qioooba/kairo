      SSHCompatProfile  string `yaml:"ssh_compat_profile"`  // modern/compat/no-ecdh/legacy/auto
      EnableFreeFileBrowser *bool `yaml:"enable_free_file_browser"`
      FreeFileRoots     []string `yaml:"free_file_roots"`
      CredentialStore   string   `yaml:"credential_store"`

      // Server 字段
