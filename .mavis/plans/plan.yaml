      - vendor/ 是否提交？
      - docs/REVIEW-FIX-agent1.md 和 docs/REVIEW-FIX-agent2.md 是否齐全？
      - README.md / docs/ACCEPTANCE.md 是否反映了新功能（free_file_roots / credential_store / async download / audit JSONL）？
