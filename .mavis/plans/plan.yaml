      ## 14 项逐项验证

      对照 `$MAVIS_SCRATCHPAD` 里的项号清单：

      1. **项 2 vendor**: 检查 `vendor/` 目录存在、`go.mod`/`go.sum` 已 tidy、构建脚本加了 `-mod=vendor`、README/docs 更新
      2. **项 19 gofmt**: `gofmt -l .` 必须 0 行（包括根目录 debug_run.go）
      3. **项 3 OR 逻辑**: 读 `internal/logquery/logquery.go` SearchCommand，确认 OR 写法语义正确；跑 `go test -mod=vendor -run OR ./internal/logquery/...`
      4. **项 4 ParseQuery**: 读 ParseQuery，确认状态机校验；跑 `go test -mod=vendor ./internal/logquery/...` 含拒绝测试
      5. **项 5 config encoding**: 读 `internal/config/config.go` Defaults 和 Validate；跑 `go test -mod=vendor ./internal/config/...`
      6. **项 21 DeepCopy**: 读 Config.Clone()，跑 `go test -mod=vendor -run Clone ./internal/config/...`
      7. **项 8 SFTP fallback**: 读 `internal/sftpclient/sftpclient.go`，确认 RemoteFS 接口、SFTPBackend、ShellBackend；跑对应测试
      8. **项 9 SSH 日志开关**: 读 sshclient.go openSSHTrafficLog / openSSHDebugLog，确认默认关闭 + rotate
      9. **项 10 HostKeyCallback**: 读 sshclient.go newSSHClientConfig，确认支持 sha256 pin
      10. **项 22 SSH profile**: 读 sshclient.go sshCompatProfiles，确认配置化；至少跑一次 `go test -mod=vendor ./internal/sshclient/...`
      11. **项 6 list_mode auto**: 读 handlers_logs_list.go 确认有 fallback 重试
      12. **项 7 posix_ls**: 读 logquery.go ParseListOutputPOSIX，确认 fields[8:]、mtime 年份、grep | head 顺序
      13. **vendor 字段**: 确认 `internal/config/config.go` App 和 Server 结构体有契约字段

      ## 边界检查

