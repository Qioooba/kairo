      HostKeySHA256     string `yaml:"host_key_sha256"`
      ```

      Audit 不要改（Agent 2 改 `internal/audit/audit.go`，但你如果需要写 audit，调 `audit.Write` 现成 API 即可）。

      ## 工作要求

      1. 先 `git status`、`git log -1` 看一下基线
