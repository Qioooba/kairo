version: 1
plan:
  name: 'OpsToolbox v3 — ChatGPT 24 项 verify + 新功能 + 前端拆分 + UI 优化 + Win10 build'
  max_concurrency: 2
  max_consecutive_failures: 2
  max_cycles: 4
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  - id: agent1-backend-v3
    title: 'Agent 1 - 后端 v3（verify ChatGPT 后端 8 项 + 新功能 3 项 + 深度单测）'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    timeout_ms: 4500000
    prompt: |-
      你是 OpsToolbox 后端 v3 agent，工作目录 `/Users/qi/Documents/spaces/ops-toolbox`。

      ## 当前基线（先验证）
      v2 plan 刚收尾（commit 437b254 / 827c134 / c8d48a4 / 2475ef3）：
      - ChatGPT 24 项里 21 项已修，剩 3 项 (项 8 SFTP ShellBackend 抽象 / 项 12 logs/download 已异步 / 项 14 file browser 警告) 可能 partial
      - vendor/ 已生成，gofmt 0 行，13/13 包测试 pass
      - acceptance T01-T29 28/28 PASS，playwright 57/57 PASS
      - working tree 有 docs/qa/playwright_smoke.js 改动（v2 收尾时加的"环境自检"卡片），其他干净

      先 `git log --oneline -8` / `git status` / `gofmt -l .` / `go build -mod=vendor ./...` / `go test -mod=vendor -count=1 ./...` 确认基线。

      ## 你的范围

      ### A. Verify ChatGPT 后端 8 项 + 补缺
      逐项打开对应文件确认：
      - **项 6 list_mode auto fallback** — 打开 `internal/logquery/logquery.go` 和 `internal/httpserver/handlers_logs_list.go`，看 `ListCommand` 和 handler 是不是真的"gnu_find 失败 → posix_ls 重试"，不是只是写了个 case auto 分支
      - **项 8 SFTP ShellBackend** — `internal/sftpclient/sftpclient.go` 看 RemoteFS 接口 + SFTPBackend + ShellBackend 是否完整实现（v2 只改了注释，要真实现）
      - **项 9 SSH debug/traffic 日志** — `internal/sshclient/sshclient.go` 确认 openSSHDebugLog / openSSHTrafficLog 读 config 而不是写死开启
      - **项 10 HostKeyCallback host_key_sha256** — `internal/sshclient/sshclient.go` 确认 `HostKeyCallback` 用 verifyFingerprint 走 SHA256
      - **项 11 MarkFinished 超时** — `internal/dlmanager/dlmanager.go` 确认 sendFinal 走 3 段 select 默认 / 500ms 超时
      - **项 12 logs/download 异步** — `internal/httpserver/handlers_logs_download_latest.go` + `handlers_logs_download_events.go` 确认异步 + SSE + 取消 + ?wait=1 兼容
      - **项 14 file browser 启动警告** — 启动日志确认有 warning
      - **项 21 config DeepCopy** — `internal/config/config.go` 确认 `Clone()`

      任何项未达标的，**当场补完**（不是只 verify）：

      ### B. 新功能 3 项（ChatGPT 第二十四节 P3 体验）

      **B1. 日志搜索时间窗口过滤**
      - 后端：`internal/logquery/logquery.go` 加 `SearchTimeWindow` 字段（start / end RFC3339）
      - handler：`internal/httpserver/handlers_logs_search.go` 接收 `since` / `until` query 参数
      - shell：保留 grep 命令，在 Go 侧对 grep 输出按 mtime 过滤
      - 测：单测覆盖 since/until 边界（包含 / 排除）、空值回退到全量
      - API：`/api/logs/search?since=2026-06-23T00:00:00Z&until=2026-06-23T23:59:59Z`

      **B2. audit 导出 JSON**
      - `internal/audit/audit.go` 加 `WriteJSON(w, filter)` 方法
      - handler：`/api/audit/export.json` 路由
      - 安全：password 字段不导出
      - 测：单测覆盖 filter 组合、空 filter、密码脱敏

      **B3. "打开下载所在目录" 后端支持**
      - 桌面平台：`internal/httpserver/handlers_downloads.go` 加 `POST /api/downloads/{id}/open-dir`
      - 实现：macOS `open -R <path>`（reveal in Finder），Windows `explorer.exe /select,<path>`，Linux `xdg-open <dir>`
      - 安全：只允许打开 `cfg.DownloadDir()` 下子目录；越界返回 403
      - 测：mock 路径（用临时目录）

      ### C. 深度单测 + 集成测试

      每个新功能必须：
      - 单元测试（handler 层、logquery、audit 内部）
      - curl 集成测试（在文档里给具体命令）

      ## 不要做
      - 不要碰 web/ 前端（Agent 2 负责）
      - 不要碰 vendor/
      - 不要改 ChatGPT 已确认 OK 的项（项 1 编译错误是 ChatGPT 误判，**别动 sshclient.go line 520/622**）
      - 不要 commit，留 working tree 给 root 统一收口
      - 不要 push

      ## 质量门（自己跑）
      ```bash
      gofmt -w .
      go build -mod=vendor ./...
      go test -mod=vendor -count=1 ./...        # 必须 14/14 (v2 是 13, +diagnostics)
      ```
      任何 fail 必须现场修。

      ## 报告
      写 `docs/REVIEW-FIX-agent1-v3.md`，包含：
      - 8 项 verify 结果表（✅ 已修 / ⚠️ partial 已补完 / ❌ 仍未修 原因）
      - 3 个新功能的文件清单 + 单测覆盖
      - 新增 curl 命令 + 预期响应
      - 质量门跑分（gofmt 行数 / build pass / test pass 数）

      **stop condition**：
      - 8 项 verify 全部 ✅ 或 已补完
      - 3 个新功能代码 + 单测落地
      - 质量门全 pass
      - 报告写完
      - working tree 干净（除新建文件）

  - id: agent2-frontend-v3
    title: 'Agent 2 - 前端 v3（web/app.js 拆分 + UI 视觉优化 + 新功能 UI）'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    timeout_ms: 4500000
    prompt: |-
      你是 OpsToolbox 前端 v3 agent，工作目录 `/Users/qi/Documents/spaces/ops-toolbox`。

      ## 当前基线（先验证）
      v2 plan 刚收尾（commit 437b134 / 827c134 / c8d48a4 / 2475ef3）：
      - web/app.js 2473 行（已超过 2000）
      - 8 个页面：home / websphere / files / formatter / commands / diagnostics / config / downloads / history
      - 10/10 web tests pass
      - playwright 57/57 PASS

      先 `wc -l web/app.js` / `node web/app.test.js` 确认。

      ## 你的范围

      ### A. 拆分 web/app.js（ChatGPT 第二十四节 6）

      目标：把 2473 行单文件拆成 7 个模块，**不改行为**（测试还得过）。

      结构：
      ```
      web/core.js          (DOM 工具 + escape + el + formatBytes 等纯函数)
      web/api.js           (api() / loadAudit / postJSON 等 HTTP 封装)
      web/state.js         (全局 state + localStorage 持久化)
      web/pages/
        home.js
        websphere.js
        files.js
        formatter.js
        diagnostics.js
        downloads.js
        history.js
        config.js
      app.js               (entry: 路由表 + 启动 + bind)
      index.html           (按依赖顺序 <script> 标签)
      web/app.test.js      (保持 10/10，可能要 import 调整)
      ```

      规则：
      - 全局只挂 `window.OTB` 一个 namespace（不引 ES module，保持零构建）
      - 每个 page 模块导出 `render(view, ...)` 函数
      - 共用 helper 走 `OTB.core` / `OTB.api` / `OTB.state`
      - 每次拆分后跑 `node web/app.test.js`，必须 10/10
      - playwright 57/57 不退步

      ### B. UI 视觉优化（每个页面都要看）

      设计基线：
      - 主色：深色背景 + 高对比度文本（不变）
      - 卡片：圆角 8px、padding 16px、border 1px var(--border)
      - 按钮：primary 实心 + secondary 描边 + 危险用红边
      - 表格：斑马纹 + hover 高亮
      - 表单：input 高度 32px，label 上小标
      - 空状态：图标 + 提示文字 + 主操作按钮
      - 加载态：骨架屏或 spinner
      - 错误态：toast 红色顶部弹出 3s 自动消失
      - 间距：8 的倍数

      每个页面（8 个）逐个看：
      - 间距 / 对齐是否舒服
      - 信息密度是否过高 / 过低
      - 主次操作是否清晰
      - 空 / 加载 / 错误 三态是否完整
      - 字号 / 字重 / 颜色 hierarchy

      重点修：
      - 首页 8 张卡片统一高度 + 网格对齐
      - WebSphere 页：搜索结果表格密度 + 操作按钮 hover 提示
      - 文件下载：左侧 server tree + 右侧文件列表的 split 比例
      - 报文格式化：左右分栏（输入 / 输出）响应式
      - 系统配置：编辑模式 / 浏览模式切换顺畅
      - 下载历史：列表 + 详情 + 操作（删除 / 打开目录 / 重新下载）
      - 操作历史：filter bar + 时间线
      - 环境自检：分组卡片，每组状态徽章

      ### C. 新功能 UI（配合 Agent 1 后端）

      **C1. 日志搜索时间窗口 UI**（Agent 1 B1）
      - WebSphere 页搜索栏加 "时间范围" 选择：
        - 快捷：最近 10 分钟 / 1 小时 / 今天 / 全部
        - 自定义：两个 datetime-local input
      - 默认 "全部"
      - URL hash 不带状态（避免污染）

      **C2. audit 导出 JSON 按钮**（Agent 1 B2）
      - 操作历史页加 "导出 JSON" 按钮（已有"导出 CSV"）
      - 同样走 fetch + 触发下载

      **C3. 下载历史 "打开目录" 按钮**（Agent 1 B3）
      - 下载历史每行加 "📂 打开所在目录" 按钮
      - 调 `/api/downloads/{id}/open-dir`
      - 失败 toast 红条 + 错误信息

      **C4. 系统配置 - 启动警告 banner**（ChatGPT 项 14）
      - 如果 `app.enable_free_file_browser=true`，配置页顶部加黄色 banner：
        "⚠️ 文件浏览器任意路径下载已开启。生产分发建议 app.enable_free_file_browser=false"
      - 关闭按钮可隐藏当前 session（localStorage）

      ### D. 视觉一致性

      拉一个 `web/styles.css` 出来（如果内联在 index.html 里的 CSS 拆出来），统一管理 token：
      ```css
      :root {
        --bg: #0f1419;
        --surface: #1a1f29;
        --text: #e4e7eb;
        --text-dim: #8b95a5;
        --border: #2a3140;
        --primary: #4a9eff;
        --danger: #ff5c5c;
        --warn: #ffb84a;
        --success: #4ade80;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --radius: 8px;
      }
      ```

      ## 不要做
      - 不要改 backend
      - 不要改 vendor/
      - 不要新增 npm 依赖（保持零构建）
      - 不要换框架（vanilla JS 继续）
      - 不要 commit

      ## 质量门（自己跑）
      ```bash
      node web/app.test.js                            # 必须 10/10
      cd docs/qa && node playwright_smoke.js          # 必须 57/57
      ```
      任何 fail 必须现场修。

      ## 报告
      写 `docs/REVIEW-FIX-agent2-v3.md`，包含：
      - 拆分前后行数对比
      - 8 个页面 UI 调整清单
      - 4 个新功能 UI 的截图（playwright 截）
      - 质量门跑分
      - 视觉对比 doc：before/after（可选，看时间）

      **stop condition**：
      - 拆分完成 + 测试 10/10
      - 8 个页面 UI 都过了一遍
      - 4 个新功能 UI 接好
      - playwright 57/57 不退步
      - 报告写完
      - working tree 干净
